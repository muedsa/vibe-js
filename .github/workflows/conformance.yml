name: Conformance

on:
  workflow_dispatch:
  schedule:
    # 每周一 02:00 UTC 运行解析一致性基线，避免阻塞日常 PR
    - cron: '0 2 * * 1'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # PR 快速子集：只跑解析基线与 Node 差分（都不需要 Test262 语料），
  # 完整 Test262 保留在手动/每周任务中，避免每个 PR 下载语料并占用数十分钟。
  pr-quick:
    name: PR Quick Subset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run parser conformance and differential
      run: ./gradlew :vibe-js-conformance:parserConformance :vibe-js-conformance:differentialConformance -Pstrict --continue --console=plain

    - name: Publish summary
      if: always()
      run: |
        for summary in \
          vibe-js-conformance/build/reports/conformance/parser-summary.md \
          vibe-js-conformance/build/reports/conformance/differential-summary.md; do
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
        done

    - name: Upload conformance reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pr-quick-conformance-report
        path: vibe-js-conformance/build/reports/conformance/
        retention-days: 14

  parser-conformance:
    name: Parser Conformance
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run parser conformance
      run: ./gradlew :vibe-js-conformance:parserConformance -Pstrict --console=plain

    - name: Publish summary
      if: always()
      run: |
        if [ -f vibe-js-conformance/build/reports/conformance/parser-summary.md ]; then
          cat vibe-js-conformance/build/reports/conformance/parser-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload conformance report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: parser-conformance-report
        path: vibe-js-conformance/build/reports/conformance/
        retention-days: 30

  test262-es5:
    name: Test262 ES5 Subset
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Test262 ES5 subset
      run: ./gradlew :vibe-js-conformance:test262Conformance -Pstrict --console=plain

    - name: Publish summary
      if: always()
      run: |
        if [ -f vibe-js-conformance/build/reports/conformance/test262-summary.md ]; then
          cat vibe-js-conformance/build/reports/conformance/test262-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload Test262 report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test262-es5-report
        path: vibe-js-conformance/build/reports/conformance/
        retention-days: 30

  test262-es2015:
    name: Test262 ES2015 Subset
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Test262 ES2015 subset
      run: ./gradlew :vibe-js-conformance:test262Es2015Conformance -Pstrict --console=plain

    - name: Publish summary
      if: always()
      run: |
        if [ -f vibe-js-conformance/build/reports/conformance/test262-es2015/test262-summary.md ]; then
          cat vibe-js-conformance/build/reports/conformance/test262-es2015/test262-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload Test262 ES2015 report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test262-es2015-report
        path: vibe-js-conformance/build/reports/conformance/
        retention-days: 30

  test262-module-tla:
    name: Test262 Module TLA
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Test262 module TLA subset
      run: ./gradlew :vibe-js-conformance:test262ModuleConformance -Pstrict --console=plain

    - name: Publish summary
      if: always()
      run: |
        if [ -f vibe-js-conformance/build/reports/conformance/test262-module/test262-summary.md ]; then
          cat vibe-js-conformance/build/reports/conformance/test262-module/test262-summary.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload Test262 module report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test262-module-report
        path: vibe-js-conformance/build/reports/conformance/
        retention-days: 30

  libraries-differential:
    name: Libraries & Node Differential
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run library smoke and differential tests
      run: ./gradlew :vibe-js-conformance:librarySmoke :vibe-js-conformance:differentialConformance --continue -Pstrict --console=plain

    - name: Publish library summary
      if: always()
      run: |
        summary="vibe-js-conformance/build/reports/conformance/libraries-summary.md"
        if [ -f "$summary" ]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Publish differential summary
      if: always()
      run: |
        summary="vibe-js-conformance/build/reports/conformance/differential-summary.md"
        if [ -f "$summary" ]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: libraries-differential-report
        path: vibe-js-conformance/build/reports/conformance/
        retention-days: 30
